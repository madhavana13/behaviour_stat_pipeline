id_cols:
  mouse: mouse_id

paths:
  processed_dir: data/processed
  metadata_subjects: data/metadata/subjects.csv
  out_tables: outputs/tables
  out_figures: outputs/figures
  out_logs: outputs/logs
  labels_csv: "configs/labels.csv"

subjects:
  normalize:
    group: lower_strip
    sex: lower_strip

  groups:
    enabled: true          # if false/omitted → accept any group labels
    allowed: ["one", "two", "control", "stressed", "tail", "cup"]
    strict: true           # if true → error; if false → warn

  sex:
    allowed: ["male", "female"]
    strict: true  

factors:
  group:
    column: group
    order: null   # or ["control", "stressed"] etc.
  sex:
    column: sex
    order: ["female", "male"]  # recommended to lock order

design:
  # These are COLUMN NAMES, not levels. Levels can be cup/tail OR stress/control etc.
  between_factors: [group, sex]

  within_factors:
    vit: []
    oft: []
    epm: []
    nor: []
    lm: []

optional:
  blocking_factors: []         # e.g., [cohort, batch] later
  cluster_col: mouse_id        # repeated measures clustering key

assays:
  - vit
  - nor
  - oft
  - epm
  - lm

primary_one_sample:
  enabled: true

  # which columns define "groups" to test within (sex collapsed by default)
  group_col: group

  # columns to collapse over (kept in data, but not used to split tests)
  collapse_over: [sex]

  # correction scope: adjust across groups within each endpoint
  correction: holm

  # choose tests to run
  run_ttest: true
  run_wilcoxon: true

  # null hypotheses per endpoint (default 0 if omitted)
  nulls:
    nor:
      di_explore: 0.0
      di_iz: 0.0
    sit: {}   # fill later

diagnostics:
  enabled: true
  groupings:
    - [group]
    - [group, sex]
  
  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft: 
      - total distance moved
      - time in center
      - distance moved in center
      - time in corners

    epm: 
      - count_head_dips
      - count_psap
      - distance_moved_in_center
      - distance_moved_on_closed_arms
      - distance_moved_on_open_arms
      - time_head_dipping
      - time_in_center
      - time_on_closed_arms
      - time_on_open_arms
      - time_psap
      - total_distance_moved
      - total_time_in_arena
      - transitions_into_center
      - transitions_into_closed_arms
      - transitions_into_open_arms
    vit:
      - "did__time in homecage"
      - "did__total distance moved"
      - "did__average speed"
      - "delta_after_minus_before__hand__total distance moved"
    lm:

      - distance_moved_in_central_alley
      - distance_moved_in_narrow_alley
      - distance_moved_in_protected_alley
      - latency_to_enter_narrow_alley
      - latency_to_enter_protected_alley
      - latency_to_re_enter_narrow_alley
      - latency_to_re_enter_protected_alley
      - transitions_into_central_alley
      - transitions_into_narrow_alley
      - transitions_into_protected_alley
      - time_in_central_alley
      - time_in_narrow_alley
      - time_in_protected_alley

secondary_two_way_anova:
  enabled: true
  type: 2
  include_interaction: true
  factors: [group, sex]

  factor_orders:
    group: []                 # empty = infer deterministically
    sex: ["female", "male"]   # lock ordering

  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft:
      - total distance moved
      - time in center
      - distance moved in center
      - time in corners
    epm: 
      - count_head_dips
      - count_psap
      - distance_moved_in_center
      - distance_moved_on_closed_arms
      - distance_moved_on_open_arms
      - time_head_dipping
      - time_in_center
      - time_on_closed_arms
      - time_on_open_arms
      - time_psap
      - total_distance_moved
      - total_time_in_arena
      - transitions_into_center
      - transitions_into_closed_arms
      - transitions_into_open_arms
    vit: 
      - "did__time in homecage"
      - "did__total distance moved"
      - "did__average speed"
      - "delta_after_minus_before__hand__total distance moved"
    lm:
      - distance_moved_in_central_alley
      - distance_moved_in_narrow_alley
      - distance_moved_in_protected_alley
      - latency_to_enter_narrow_alley
      - latency_to_enter_protected_alley
      - latency_to_re_enter_narrow_alley
      - latency_to_re_enter_protected_alley
      - transitions_into_central_alley
      - transitions_into_narrow_alley
      - transitions_into_protected_alley
      - time_in_central_alley
      - time_in_narrow_alley
      - time_in_protected_alley


  posthoc:
    enabled: true
    method: cell_means_prism
    correction: sidak
    selected_pairs:
      - name: group_within_sex_0
        a: {group: 0, sex: 0}
        b: {group: 1, sex: 0}
      - name: sex_within_group_0
        a: {group: 0, sex: 0}
        b: {group: 0, sex: 1}
      - name: sex_within_group_1
        a: {group: 1, sex: 0}
        b: {group: 1, sex: 1}
      - name: group_within_sex_1
        a: {group: 0, sex: 1}
        b: {group: 1, sex: 1}
  
correlations:
  enabled: true

  # global defaults applied to every spec unless overridden
  defaults:
    method: spearman
    groupings: null          # null → use default_groupings
    filter: null
    covariates: []
    se: robust_hc3
    cluster_col: mouse_id

  # how to split the data for separate correlations
  # [] means pooled across all animals
  default_groupings:
    - []
    - [group]
    - [group, sex]
  
  # multiple-comparison correction across all tests produced by each spec
  correction: fdr_bh         # holm | bonferroni | sidak | fdr_bh | fdr_by | none

  min_n: 8                  # minimum N per group to run correlation

  # minimal per-spec definitions
  specs:
    - assay: nor
      x: "test_total distance moved"
      y: "test_novel_explore_time"

    - assay: nor
      x: "di_explore"
      y: "test_total_explore_time"

    - assay: oft
      x: "total distance moved"
      y: "time in center"

    - assay: vit
      x: "did__total distance moved"
      y: "delta_after_minus_before__hand__total distance moved"

    - assay: lm
      x: "latency_to_enter_narrow_alley" 
      y: "time_in_narrow_alley" 

      method: pearson        # optional override
      groupings:
        - []                 # optional override (pooled only)

figures:
  enabled: true

  # auto-generate one simple "Total" plot per endpoint listed in stats.yaml
  # (single-column endpoints only; multi-column plots stay manual specs)
  auto_from_endpoints:
    enabled: true
    source: "secondary_two_way_anova"
    exclude:
      - "test_total distance moved"   # already manually specified below
      - "test_familiar_iz_time"       # already shown in nor_test_object_times
      - "test_novel_iz_time"          # already shown in nor_test_object_times

  defaults:
    # aesthetics  
    group_edgecolors:
      tail: "black"
      cup: "darkorange"
      one: "RoyalBlue"
      two: "MediumSeaGreen"
    sex_markers:
      female: "o"
      male: "^"
    label_maps:
      timepoint:
        Total: ""

    # layout + geometry (these are the ones your runner actually reads)
    group_gap: 0.10     # smaller = groups closer
    box_width: 0.25     # slimmer boxes
    x_gap: 0.8            # less horizontal gap between x categories within groups
    sex_dodge: 0.05     # slightly tighter male/female dodge
    figure_size: [5.2, 4.2]
    dpi: 300
    group_order: ["tail", "cup", "one", "two"]

    # point styling
    jitter_sd: 0.09     # less horizontal noise
    point_size: 14      # slightly smaller points
    point_alpha: 0.85   # a touch more subtle

    # statistical annotations
    significance:
      enabled: true    

      anova_summary:
        enabled: true
        table: "secondary_two_way_anova"
        endpoint_col: "endpoint"
        term_col: "term"
        label_col: "significance_label"
        p_col: "p_adj"
        y_pad_frac: 0.08     
        h_frac: 0.035
        linewidth: 1.2
        title_buffer_frac: 0.12

        terms:
          group: 'C(Q("group"))'
          sex: 'C(Q("sex"))'
          interaction: 'C(Q("group")):C(Q("sex"))'
          
        show_numeric_p: false
        loc_map:
            "upper right": (0.98, 0.98)
            "upper left": (0.02, 0.98)
        fontsize: 10


    # output formats
    formats: ["png"]

  specs:
    - name: "nor_test_object_times"
      assay: "nor"
      type: "boxpoints"
      value_label: "Time with objects (s)"
      x_order: ["Familiar", "Novel"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "object"
        mapping:
          Familiar: "test_familiar_iz_time"
          Novel: "test_novel_iz_time"

    - name: "test_total distance moved"
      assay: "nor"
      type: "boxpoints"
      x_gap: 0.8
      value_label: "Distance moved (m)"
      x_order: ["Total"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Total: "test_total distance moved"

    - name: "Time in Alleys"
      assay: "lm"
      type: "boxpoints"
      x_gap: 0.65
      value_label: "Time (s)"
      x_order: ["Protected", "Centre", "Narrow"]
      group_order: ["centre", "narrow_centre"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Protected: "lm_time_protected_s"
          Centre: "lm_time_center_s"
          Narrow: "lm_time_narrow_s"          

  auto_from_correlations:
    enabled: true
    # Create one pooled scatter per correlations.specs entry (Friday-safe)
    fit_enabled: true
    exclude: []  # optional list of correlation spec names to skip
