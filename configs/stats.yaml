id_cols:
  mouse: mouse_id

paths:
  processed_dir: data/processed
  metadata_subjects: data/metadata/subjects.csv
  out_tables: outputs/tables
  out_figures: outputs/figures
  out_logs: outputs/logs
  labels_csv: "configs/labels.csv"

subjects:
  normalize:
    group: lower_strip
    sex: lower_strip

  groups:
    enabled: False          # if false/omitted → accept any group labels
    allowed: ["one", "two", "control", "stressed", "tail", "cup", "IFS"]
    strict: true           # if true → error; if false → warn

  sex:
    allowed: ["male", "female"]
    strict: true  

factors:
  group:
    column: group
    order: null   # or ["control", "stressed"] etc.
  sex:
    column: sex
    order: ["female", "male"]  # recommended to lock order

design:
  # These are COLUMN NAMES, not levels. Levels can be cup/tail OR stress/control etc.
  between_factors: [group, sex]

  within_factors:
    vit: []
    oft: []
    epm: []
    nor: []
    lm: []
    misc: []

optional:
  blocking_factors: []         # e.g., [cohort, batch] later
  cluster_col: mouse_id        # repeated measures clustering key

# assays, endpoints, models and correlation specs are set per experiment:
# configs/experiments/<EXP>.yaml -> analysis:. This file holds method defaults.

primary_one_sample:
  enabled: true

  # which columns define "groups" to test within (sex collapsed by default)
  group_col: group

  # columns to collapse over (kept in data, but not used to split tests)
  collapse_over: [sex]

  # correction scope: adjust across groups within each endpoint
  correction: holm

  # choose tests to run
  run_ttest: true
  run_wilcoxon: true

  # null hypotheses per endpoint: experiment config analysis.primary_one_sample.nulls

diagnostics:
  enabled: true
  groupings:
    - [group]
    - [group, sex]
  
  # endpoints: experiment config analysis.diagnostics.endpoints


secondary_two_way_anova:
  enabled: true
  type: 2
  include_interaction: true
  factors: [group, sex]
  correction_across_endpoints: holm

  factor_orders:
    group: []                 # empty = infer deterministically
    sex: ["female", "male"]   # lock ordering

  # endpoints: experiment config analysis.secondary_two_way_anova.endpoints

  posthoc:
    enabled: true
    method: cell_means_prism
    correction: sidak
    selected_pairs:
      - name: group_within_sex_0
        a: {group: 0, sex: 0}
        b: {group: 1, sex: 0}
      - name: sex_within_group_0
        a: {group: 0, sex: 0}
        b: {group: 0, sex: 1}
      - name: sex_within_group_1
        a: {group: 1, sex: 0}
        b: {group: 1, sex: 1}
      - name: group_within_sex_1
        a: {group: 0, sex: 1}
        b: {group: 1, sex: 1}

# Latencies where the event may never happen within the trial.
# Missing latency + recorded animal -> right-censored at the recording length.
# Recording length per animal: duration_col if present, else the assay's
# trial_duration_s in the experiment config (assay_instances.<NAME>.trial_duration_s).
time_to_event:
  enabled: true
  factors: [group, sex]
  duration_col: time_in_arena
  correction_across_endpoints: holm

  # endpoints: experiment config analysis.time_to_event.endpoints

# Linear and linear mixed models (optional R backend: nlme, ships with R).
#   fixed:       right-hand side; factors from design.between_factors / optional.blocking_factors,
#                `covariates`, the stacked factor (stack_as) and `baseline`
#   random:      nlme syntax, e.g. "~ 1 | mouse_id" or "~ 1 | cage/mouse_id"; null -> no random effects (gls)
#   baseline:    assay instance whose value of the same endpoint is a per-mouse covariate (ANCOVA);
#                must not also be listed in assays (covariate OR repeated level, not both)
#   variance_by: factors with their own residual variance (unequal variances); [] -> equal variances
#   contrasts:   pairwise levels of `factor` within each level of `by` (cell means equally weighted)
# Type III F-tests (sum-to-zero contrasts, covariates centred at the mean over animals).
linear_models:
  enabled: true
  rscript: null                       # null -> BSP_RSCRIPT env var, PATH, or standard install location
  correction_across_endpoints: holm   # per term, across the model's endpoints
  contrast_correction: holm           # within endpoint, across the levels of `by`

  # models: experiment config analysis.linear_models.models

correlations:
  enabled: true

  # global defaults applied to every spec unless overridden
  defaults:
    method: spearman
    groupings: null          # null → use default_groupings
    filter: null
    covariates: []
    se: robust_hc3
    cluster_col: mouse_id

  # how to split the data for separate correlations
  # [] means pooled across all animals
  default_groupings:
    - []
    - [group]
    - [group, sex]
  
  # multiple-comparison correction across all tests produced by each spec
  correction: fdr_bh         # holm | bonferroni | sidak | fdr_bh | fdr_by | none

  min_n: 8                  # minimum N per group to run correlation

  # specs: experiment config analysis.correlations.specs


misc:
  raw_file: data/experiments/EXP-2026-002/metadata/misc_raw.csv

  masks:
    - when: flag_rct
      equals: 1
      targets: [sucrose_consumption, normal_consumption]

  derived_metrics:
    - name: adrenal_total_mg
      kind: sum
      columns: [left_adrenal_mg, right_adrenal_mg]

    - name: left_adrenal_mg_per_g_bw
      kind: normalize_by
      value: left_adrenal_mg
      by: terminal_weight

    - name: right_adrenal_mg_per_g_bw
      kind: normalize_by
      value: right_adrenal_mg
      by: terminal_weight

    - name: adrenal_total_mg_per_g_bw
      kind: normalize_by
      value: adrenal_total_mg
      by: terminal_weight

    - name: rct_total_intake
      kind: sum
      columns: [sucrose_consumption, normal_consumption]

    - name: rct_pi
      kind: pi
      preferred: sucrose_consumption
      other: normal_consumption

    - name: rct_di
      kind: di
      preferred: sucrose_consumption
      other: normal_consumption


