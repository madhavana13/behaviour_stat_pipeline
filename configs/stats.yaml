id_cols:
  mouse: mouse_id

paths:
  processed_dir: data/processed
  metadata_subjects: data/metadata/subjects.csv
  out_tables: outputs/tables
  out_figures: outputs/figures
  out_logs: outputs/logs
  labels_csv: "configs/labels.csv"

subjects:
  normalize:
    group: lower_strip
    sex: lower_strip

  groups:
    enabled: False          # if false/omitted → accept any group labels
    allowed: ["one", "two", "control", "stressed", "tail", "cup", "IFS"]
    strict: true           # if true → error; if false → warn

  sex:
    allowed: ["male", "female"]
    strict: true  

factors:
  group:
    column: group
    order: null   # or ["control", "stressed"] etc.
  sex:
    column: sex
    order: ["female", "male"]  # recommended to lock order

design:
  # These are COLUMN NAMES, not levels. Levels can be cup/tail OR stress/control etc.
  between_factors: [group, sex]

  within_factors:
    vit: []
    oft: []
    epm: []
    nor: []
    lm: []
    misc: []

optional:
  blocking_factors: []         # e.g., [cohort, batch] later
  cluster_col: mouse_id        # repeated measures clustering key

assays:
  - vit
  - nor
  - oft
  - epm
  - lm
  - misc

primary_one_sample:
  enabled: true
  group_col: group
  collapse_over: [sex]
  correction: holm
  run_ttest: true
  run_wilcoxon: true

  nulls:
    nor:
      di_explore: 0.0
      di_iz: 0.0
    misc:
      rct_di: 0.0

  # which columns define "groups" to test within (sex collapsed by default)
  group_col: group

  # columns to collapse over (kept in data, but not used to split tests)
  collapse_over: [sex]

  # correction scope: adjust across groups within each endpoint
  correction: holm

  # choose tests to run
  run_ttest: true
  run_wilcoxon: true

  # null hypotheses per endpoint (default 0 if omitted)
  nulls:
    nor:
      di_explore: 0.0
      di_iz: 0.0
    sit: {}   # fill later

diagnostics:
  enabled: true
  groupings:
    - [group]
    - [group, sex]
  
  endpoints:
    nor:
      - fam_total_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total_distance_moved
      - test_total_distance_moved
    oft:
      - total_distance_moved
      - time_in_center
      - distance_moved_in_center
      - time_in_corners
      - classifier__supported_rearing_time
      - classifier__supported_rearing_count
      - classifier__unsupported_rearing_time
      - classifier__unsupported_rearing_count
      - classifier__grooming_time
      - classifier__grooming_count
      - classifier__digging_time
      - classifier__digging_count
    epm: 
      - count_head_dips
      - count_psap
      - distance_moved_in_center
      - distance_moved_on_closed_arms
      - distance_moved_on_open_arms
      - time_head_dipping
      - time_in_center
      - time_on_closed_arms
      - time_on_open_arms
      - time_psap
      - total_distance_moved
      - total_time_in_arena
      - transitions_into_center
      - transitions_into_closed_arms
      - transitions_into_open_arms
    vit: 
      - delta_after_minus_before__hand__time_in_right_lower_quadrant
      - hand__Before__time_in_right_lower_quadrant
      - hand__Before__time_in_right_lower_quadrant
      - hand__After__time_in_right_lower_quadrant
      - standing__Before__distance_moved_in_left_lower_quadrant
      - standing__Before__distance_moved_in_left_upper_quadrant
      - standing__Before__distance_moved_in_right_lower_quadrant
      - standing__Before__distance_moved_in_right_upper_quadrant

    lm:
      - distance_moved_in_central_alley
      - total_distance_moved
      - distance_moved_in_narrow_alley
      - distance_moved_in_protected_alley
      - latency_to_enter_narrow_alley
      - latency_to_enter_protected_alley
      - latency_to_re_enter_narrow_alley
      - latency_to_re_enter_protected_alley
      - transitions_into_central_alley
      - transitions_into_narrow_alley
      - transitions_into_protected_alley
      - time_in_central_alley
      - time_in_narrow_alley
      - time_in_protected_alley

    misc:
      - left_adrenal_mg
      - right_adrenal_mg
      - adrenal_total_mg
      - left_adrenal_mg_per_g_bw
      - right_adrenal_mg_per_g_bw
      - adrenal_total_mg_per_g_bw
      - rct_total_intake
      - rct_pi
      - rct_di

secondary_two_way_anova:
  enabled: true
  type: 2
  include_interaction: true
  factors: [group, sex]

  factor_orders:
    group: []                 # empty = infer deterministically
    sex: ["female", "male"]   # lock ordering

  endpoints:
    nor:
      - fam_total_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total_distance_moved
      - test_total_distance_moved
    oft:
      - total_distance_moved
      - time_in_center
      - distance_moved_in_center
      - time_in_corners
      - classifier__supported_rearing_time
      - classifier__supported_rearing_count
      - classifier__unsupported_rearing_time
      - classifier__unsupported_rearing_count
      - classifier__grooming_time
      - classifier__grooming_count
      - classifier__digging_time
      - classifier__digging_count


    epm: 
      - count_head_dips
      - count_psap
      - distance_moved_in_center
      - distance_moved_on_closed_arms
      - distance_moved_on_open_arms
      - time_head_dipping
      - time_in_center
      - time_on_closed_arms
      - time_on_open_arms
      - time_psap
      - total_distance_moved
      - total_time_in_arena
      - transitions_into_center
      - transitions_into_closed_arms
      - transitions_into_open_arms
    vit: 
      - delta_after_minus_before__hand__time_in_right_lower_quadrant
      - hand__Before__time_in_right_lower_quadrant
      - hand__Before__time_in_right_lower_quadrant
      - hand__After__time_in_right_lower_quadrant
      - standing__Before__distance_moved_in_left_lower_quadrant
      - standing__Before__distance_moved_in_left_upper_quadrant
      - standing__Before__distance_moved_in_right_lower_quadrant
      - standing__Before__distance_moved_in_right_upper_quadrant

    lm:
      - distance_moved_in_central_alley
      - total_distance_moved
      - distance_moved_in_narrow_alley
      - distance_moved_in_protected_alley
      - latency_to_enter_narrow_alley
      - latency_to_enter_protected_alley
      - latency_to_re_enter_narrow_alley
      - latency_to_re_enter_protected_alley
      - transitions_into_central_alley
      - transitions_into_narrow_alley
      - transitions_into_protected_alley
      - time_in_central_alley
      - time_in_narrow_alley
      - time_in_protected_alley

    misc:
      - left_adrenal_mg
      - right_adrenal_mg
      - adrenal_total_mg
      - left_adrenal_mg_per_g_bw
      - right_adrenal_mg_per_g_bw
      - adrenal_total_mg_per_g_bw
      - rct_total_intake
      - rct_pi
      - rct_di


  posthoc:
    enabled: true
    method: cell_means_prism
    correction: sidak
    selected_pairs:
      - name: group_within_sex_0
        a: {group: 0, sex: 0}
        b: {group: 1, sex: 0}
      - name: sex_within_group_0
        a: {group: 0, sex: 0}
        b: {group: 0, sex: 1}
      - name: sex_within_group_1
        a: {group: 1, sex: 0}
        b: {group: 1, sex: 1}
      - name: group_within_sex_1
        a: {group: 0, sex: 1}
        b: {group: 1, sex: 1}
  
correlations:
  enabled: true

  # global defaults applied to every spec unless overridden
  defaults:
    method: spearman
    groupings: null          # null → use default_groupings
    filter: null
    covariates: []
    se: robust_hc3
    cluster_col: mouse_id

  # how to split the data for separate correlations
  # [] means pooled across all animals
  default_groupings:
    - []
    - [group]
    - [group, sex]
  
  # multiple-comparison correction across all tests produced by each spec
  correction: fdr_bh         # holm | bonferroni | sidak | fdr_bh | fdr_by | none

  min_n: 8                  # minimum N per group to run correlation

  # minimal per-spec definitions
  specs:
    - assay: nor
      x: "test_total_distance_moved"
      y: "test_novel_explore_time"

    - assay: nor
      x: "di_explore"
      y: "test_total_explore_time"

    - assay: oft
      x: "total_distance_moved"
      y: "time_in_center"

    - assay: lm
      x: "latency_to_enter_narrow_alley" 
      y: "time_in_narrow_alley" 

      method: pearson        # optional override
      groupings:
        - []                 # optional override (pooled only)
        

figures:
  enabled: true

  auto_from_endpoints:
    enabled: true
    source: secondary_two_way_anova
    show_titles: false
    exclude: []
  
  defaults:
    show_title: false
    figure_size: [2.4, 2.4]
    dpi: 300

    box_width: 0.10
    box_linewidth: 1.1
    median_linewidth: 1.1
    whisker_linewidth: 1.0
    cap_linewidth: 1.0

    point_size: 6
    point_alpha: 0.75
    jitter_sd: 0.035
    sex_dodge: 0.035

    group_gap: 0.25
    x_margin: 0.14
    title_pad: 3
    group_label_y: -0.10
    ylim_top_mult: 1.18

    title_fontsize: 8
    axis_label_fontsize: 7
    tick_label_fontsize: 6
    group_label_fontsize: 7
    annotation_fontsize: 6
    bracket_fontsize: 6

    spine_linewidth: .5
    tick_width: 0.6
    tick_length: 2

    group_edgecolors:
      tail: "black"
      cup: "darkorange"
      control: "RoyalBlue"
      ifs: "MediumSeaGreen"

    sex_markers:
      female: "o"
      male: "^"

    group_order: ["tail", "cup", "one", "two", "control", "stressed", "ifs"]

    significance:
      enabled: true
      anova_summary:
        enabled: true
        display:
          group: bracket
          sex: none
          interaction: none
        y_pad_frac: 0.025
        h_frac: 0.015
        title_buffer_frac: 0.035
        linewidth: 0.9
        fontsize: 7

      one_sample_summary:
        enabled: true
        table: "primary_one_sample"
        endpoint_col: "endpoint"
        group_col: "group"
        label_col: "t_p_adj_holm"

    formats: ["png"]

  specs:
    - name: "Time with objects"
      assay: "nor"
      type: "boxpoints"
      value_label: "Time with objects (s)"
      x_order: ["Familiar", "Novel"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "object"
        mapping:
          Familiar: "test_familiar_iz_time"
          Novel: "test_novel_iz_time"

    - name: "test_total_distance_moved"
      assay: "nor"
      type: "boxpoints"
      x_gap: 0.8
      value_label: "Distance moved (m)"
      x_order: ["Total"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Total: "test_total_distance_moved"

    - name: "Time in Alleys"
      assay: "lm"
      type: "boxpoints"
      x_gap: 0.8
      value_label: "Time (s)"
      x_order: ["Protected", "Centre", "Narrow"]
      group_order: ["centre", "narrow_centre"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Protected: "lm_time_protected_s"
          Centre: "lm_time_center_s"
          Narrow: "lm_time_narrow_s"

    - name: "Time spent with hand in right lower quadrant"
      assay: "vit"
      type: "boxpoints"
      x_gap: 0.8
      value_label: "Time (s)"
      x_order: ["Before", "After"]
      group_order: ["tail", "cup", "control", "ifs"]
      wide_to_long:
        x_col: "timepoint"
        mapping:
          Before: "hand__Before__time_in_right_lower_quadrant"
          After: "hand__After__time_in_right_lower_quadrant"

  auto_from_correlations:
    enabled: true
    fit_enabled: true
    exclude: []


misc:
  raw_file: data/experiments/EXP-2026-002/metadata/misc_raw.csv

  masks:
    - when: flag_rct
      equals: 1
      targets: [sucrose_consumption, normal_consumption]

  derived_metrics:
    - name: adrenal_total_mg
      kind: sum
      columns: [left_adrenal_mg, right_adrenal_mg]

    - name: left_adrenal_mg_per_g_bw
      kind: normalize_by
      value: left_adrenal_mg
      by: terminal_weight

    - name: right_adrenal_mg_per_g_bw
      kind: normalize_by
      value: right_adrenal_mg
      by: terminal_weight

    - name: adrenal_total_mg_per_g_bw
      kind: normalize_by
      value: adrenal_total_mg
      by: terminal_weight

    - name: rct_total_intake
      kind: sum
      columns: [sucrose_consumption, normal_consumption]

    - name: rct_pi
      kind: pi
      preferred: sucrose_consumption
      other: normal_consumption

    - name: rct_di
      kind: di
      preferred: sucrose_consumption
      other: normal_consumption


