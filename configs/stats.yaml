id_cols:
  mouse: mouse_id

paths:
  processed_dir: data/processed
  metadata_subjects: data/metadata/subjects.csv
  out_tables: outputs/tables
  out_figures: outputs/figures
  out_logs: outputs/logs

factors:
  group:
    column: group
    order: null   # or ["control", "stressed"] etc.
  sex:
    column: sex
    order: ["female", "male"]  # recommended to lock order

design:
  # These are COLUMN NAMES, not levels. Levels can be cup/tail OR stress/control etc.
  between_factors: [group, sex]

  within_factors:
    vit: [timepoint, phase]
    oft: []
    epm: []
    nor: []

optional:
  blocking_factors: []         # e.g., [cohort, batch] later
  cluster_col: mouse_id        # repeated measures clustering key

assays:
  - vit
  - nor
  - oft
  - epm

primary_one_sample:
  enabled: true

  # which columns define "groups" to test within (sex collapsed by default)
  group_col: group

  # columns to collapse over (kept in data, but not used to split tests)
  collapse_over: [sex]

  # correction scope: adjust across groups within each endpoint
  correction: holm

  # choose tests to run
  run_ttest: true
  run_wilcoxon: true

  # null hypotheses per endpoint (default 0 if omitted)
  nulls:
    nor:
      di_explore: 0.0
      di_iz: 0.0
    sit: {}   # fill later

diagnostics:
  enabled: true
  groupings:
    - [group]
    - [group, sex]
  
  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft: []
    epm: []
    vit: []

secondary_two_way_anova:
  enabled: true
  type: 2
  include_interaction: true
  factors: [group, sex]

  factor_orders:
    group: []                 # empty = infer deterministically
    sex: ["female", "male"]   # lock ordering

  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft: []
    epm: []
    vit: []

  posthoc:
    enabled: true
    method: cell_means_prism
    correction: sidak
    selected_pairs:
      - name: group_within_sex_0
        a: {group: 0, sex: 0}
        b: {group: 1, sex: 0}
      - name: sex_within_group_0
        a: {group: 0, sex: 0}
        b: {group: 0, sex: 1}
      - name: sex_within_group_1
        a: {group: 1, sex: 0}
        b: {group: 1, sex: 1}
      - name: group_within_sex_1
        a: {group: 0, sex: 1}
        b: {group: 1, sex: 1}
figures:
  enabled: true
  defaults:
    jitter_sd: 0.18
    point_size: 28
    point_alpha: 0.9
    y_lim: null
    group_edgecolors:
      tail: "black"
      cup: "orange"
    sex_markers:
      female: "o"
      male: "^"
    formats: ["png"] #can add other file formats later, e.g., ["svg", "pdf"]
  PlotStyle:
    group_gap: float = 0.3      # was 1.0
    box_width: float = 0.45     # was 0.6
    sex_dodge: float = 0.06  

  specs:
    - name: "nor_test_object_times"
      assay: "nor"
      type: "boxpoints"
      value_label: "Time with objects (s)"
      x_label: "Object"
      x_order: ["Familiar", "Novel"]
      group_order: ["tail", "cup"]   # optional but recommended for consistent block order
      # wide-to-long mapping (two boxes per group)
      wide_to_long:
        x_col: "object"
        mapping:
          Familiar: "test_familiar_iz_time"
          Novel: "test_novel_iz_time"

    - name: "test_total distance moved"
      assay: "nor"
      type: "boxpoints"
      value_label: "Distance moved (cm)"
      x_label: "Measure"
      x_order: ["Total"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Total: "test_total distance moved"
