id_cols:
  mouse: mouse_id

paths:
  processed_dir: data/processed
  metadata_subjects: data/metadata/subjects.csv
  out_tables: outputs/tables
  out_figures: outputs/figures
  out_logs: outputs/logs

factors:
  group:
    column: group
    order: null   # or ["control", "stressed"] etc.
  sex:
    column: sex
    order: ["female", "male"]  # recommended to lock order

design:
  # These are COLUMN NAMES, not levels. Levels can be cup/tail OR stress/control etc.
  between_factors: [group, sex]

  within_factors:
    vit: [timepoint, phase]
    oft: []
    epm: []
    nor: []

optional:
  blocking_factors: []         # e.g., [cohort, batch] later
  cluster_col: mouse_id        # repeated measures clustering key

assays:
  - vit
  - nor
  - oft
  - epm

primary_one_sample:
  enabled: true

  # which columns define "groups" to test within (sex collapsed by default)
  group_col: group

  # columns to collapse over (kept in data, but not used to split tests)
  collapse_over: [sex]

  # correction scope: adjust across groups within each endpoint
  correction: holm

  # choose tests to run
  run_ttest: true
  run_wilcoxon: true

  # null hypotheses per endpoint (default 0 if omitted)
  nulls:
    nor:
      di_explore: 0.0
      di_iz: 0.0
    sit: {}   # fill later

diagnostics:
  enabled: true
  groupings:
    - [group]
    - [group, sex]
  
  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft: 
      - total distance moved
      - time in center
      - distance moved in center
      - time in corners

    epm: []
    vit: []

secondary_two_way_anova:
  enabled: true
  type: 2
  include_interaction: true
  factors: [group, sex]

  factor_orders:
    group: []                 # empty = infer deterministically
    sex: ["female", "male"]   # lock ordering

  endpoints:
    nor:
      - test_familiar_explore_time
      - test_novel_explore_time
      - test_familiar_iz_time
      - test_novel_iz_time
      - di_explore
      - di_iz
      - fam_total distance moved
      - test_total distance moved
    oft:
      - total distance moved
      - time in center
      - distance moved in center
      - time in corners
    epm: []
    vit: []

  posthoc:
    enabled: true
    method: cell_means_prism
    correction: sidak
    selected_pairs:
      - name: group_within_sex_0
        a: {group: 0, sex: 0}
        b: {group: 1, sex: 0}
      - name: sex_within_group_0
        a: {group: 0, sex: 0}
        b: {group: 0, sex: 1}
      - name: sex_within_group_1
        a: {group: 1, sex: 0}
        b: {group: 1, sex: 1}
      - name: group_within_sex_1
        a: {group: 0, sex: 1}
        b: {group: 1, sex: 1}
  
correlations:
  enabled: true

  # global defaults applied to every spec unless overridden
  defaults:
    method: spearman
    groupings: null          # null → use default_groupings
    filter: null
    covariates: []
    se: robust_hc3
    cluster_col: mouse_id

  # how to split the data for separate correlations
  # [] means pooled across all animals
  default_groupings:
    - []
    - [group]
    - [group, sex]
  
  # multiple-comparison correction across all tests produced by each spec
  correction: fdr_bh         # holm | bonferroni | sidak | fdr_bh | fdr_by | none

  min_n: 6

  # minimal per-spec definitions
  specs:
    - assay: nor
      x: "test_total distance moved"
      y: "test_novel_explore_time"

    - assay: nor
      x: "di_explore"
      y: "test_total_explore_time"

    - assay: oft
      x: "total distance moved"
      y: "time in center"

      method: pearson        # optional override
      groupings:
        - []                 # optional override (pooled only)


figures:
  enabled: true

  # auto-generate one simple "Total" plot per endpoint listed in stats.yaml
  # (single-column endpoints only; multi-column plots stay manual specs)
  auto_from_endpoints:
    enabled: true
    source: "secondary_two_way_anova"
    exclude:
      - "test_total distance moved"   # already manually specified below
      - "test_familiar_iz_time"       # already shown in nor_test_object_times
      - "test_novel_iz_time"          # already shown in nor_test_object_times

  defaults:
    # aesthetics
  
    group_edgecolors:
      tail: "black"
      cup: "orange"
    sex_markers:
      female: "o"
      male: "^"

    # layout + geometry (these are the ones your runner actually reads)
    group_gap: 0.15
    box_width: 0.30
    sex_dodge: 0.06
    figure_size: [6.0, 4.8]   # inches
    dpi: 300
    group_order: ["tail", "cup"]

    # point styling
    jitter_sd: 0.18
    point_size: 22
    point_alpha: 0.9

    # output formats
    formats: ["png"]

  specs:
    - name: "nor_test_object_times"
      assay: "nor"
      type: "boxpoints"
      value_label: "Time with objects (s)"
      x_order: ["Familiar", "Novel"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "object"
        mapping:
          Familiar: "test_familiar_iz_time"
          Novel: "test_novel_iz_time"

    - name: "test_total distance moved"
      assay: "nor"
      type: "boxpoints"
      value_label: "Distance moved (cm)"
      x_order: ["Total"]
      group_order: ["tail", "cup"]
      wide_to_long:
        x_col: "measure"
        mapping:
          Total: "test_total distance moved"

  auto_from_correlations:
    enabled: true
    # Create one pooled scatter per correlations.specs entry (Friday-safe)
    fit_enabled: true
    exclude: []  # optional list of correlation spec names to skip
