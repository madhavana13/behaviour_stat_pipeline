figures:
  enabled: true

  auto_from_endpoints:
    enabled: true
    source: secondary_two_way_anova
    show_titles: false
    exclude: []

  defaults:
    show_title: false
    figure_size: [2.65, 3.35]
    dpi: 300
    transparent_background: false

    # Optional debugging labels for individual points
    show_point_ids: false
    point_id_fontsize: 2
    point_id_dx: 0.015
    point_id_dy: 0.0

    # Compact two-group auto plots
    box_width: 0.025
    box_face_alpha: 0.10
    box_linewidth: 1.0
    median_linewidth: 1.1
    whisker_linewidth: 1.0
    cap_linewidth: 1.0

    point_size: 10
    point_alpha: 0.90
    jitter_sd: 0.008
    sex_dodge: 0.006

    group_gap: 0.06
    x_gap: 0.35
    x_margin: 0.03

    title_pad: 2
    group_label_y: -0.09
    ylim_top_mult: 1.08

    axis_color: "black"
    text_color: "black"
    title_fontsize: 8
    axis_label_fontsize: 8
    tick_label_fontsize: 7
    group_label_fontsize: 8
    annotation_fontsize: 7
    bracket_fontsize: 7

    spine_linewidth: 0.7
    tick_width: 0.7
    tick_length: 2.5

    group_edgecolors:
      tail: "dimgray"
      cup: "darkorange"
      control: "darkorchid"
      ifs: "darkorange"
      stressed: "darkorange"
      centre: "darkorchid"
      narrow_centre: "darkorange"

    sex_markers:
      female: "o"
      male: "^"

    group_order: ["tail", "cup", "one", "two", "control", "stressed", "ifs"]

    significance:
      enabled: true

      anova_summary:
        enabled: true
        table: "secondary_two_way_anova"
        endpoint_col: "endpoint"
        term_col: "term"
        label_col: "significance_label"
        display:
          group: bracket
          sex: none
          interaction: none
        y_pad_frac: 0.014
        h_frac: 0.008
        title_buffer_frac: 0.020
        linewidth: 0.9
        fontsize: 7

      one_sample_summary:
        enabled: true
        table: "primary_one_sample"
        endpoint_col: "endpoint"
        group_col: "group"
        label_col: "t_p_adj_holm"

    formats: ["png"]

  specs:
    - name: "Time with objects"
      assay: "nor"
      type: "boxpoints"
      value_label: "Time with objects (s)"
      x_order: ["Familiar", "Novel"]
      group_order: ["control", "ifs"]
      figure_size: [4.2, 3.4]
      box_width: 0.08
      group_gap: 0.55
      x_gap: 0.38
      x_margin: 0.14
      jitter_sd: 0.018
      sex_dodge: 0.018
      point_size: 10
      ylim_top_mult: 1.10
      title_fontsize: 8
      axis_label_fontsize: 8
      tick_label_fontsize: 7
      group_label_fontsize: 8
      wide_to_long:
        x_col: "object"
        mapping:
          Familiar: "test_familiar_iz_time"
          Novel: "test_novel_iz_time"
      significance:
        anova_summary:
          enabled: true
          manual_brackets:
            - from: {group: "control", x: "Familiar"}
              to:   {group: "control", x: "Novel"}
              label: "*"
              linewidth: 0.5
              fontsize: 7
              y: 54
              h: 0.8
            - from: {group: "ifs", x: "Familiar"}
              to:   {group: "ifs", x: "Novel"}
              label: "*"
              linewidth: 0.5
              fontsize: 7
              y: 54
              h: 0.8

    - name: "test_total_distance_moved"
      assay: "nor"
      type: "boxpoints"
      value_label: "Distance moved (m)"
      x_order: ["Total"]
      group_order: ["control", "ifs", "tail", "cup"]
      figure_size: [2.65, 3.35]
      box_width: 0.02
      group_gap: 0.06
      x_margin: 0.03
      jitter_sd: 0.008
      sex_dodge: 0.006
      point_size: 10
      ylim_top_mult: 1.08
      wide_to_long:
        x_col: "measure"
        mapping:
          Total: "test_total_distance_moved"

    - name: "Time in Alleys"
      assay: "lm"
      type: "boxpoints"
      value_label: "Time (s)"
      x_order: ["Protected", "Centre", "Narrow"]
      group_order: ["control", "ifs"]
      figure_size: [4.4, 3.4]
      box_width: 0.055
      group_gap: 0.42
      x_gap: 0.24
      x_margin: 0.12
      jitter_sd: 0.010
      sex_dodge: 0.010
      point_size: 8
      title: false
      ylim_top_mult: 1.08
      wide_to_long:
        x_col: "measure"
        mapping:
          Protected: "lm_time_protected_s"
          Centre: "lm_time_center_s"
          Narrow: "lm_time_narrow_s"

    - name: "Time spent with hand in right lower quadrant"
      assay: "vit"
      type: "boxpoints"
      value_label: "Time (s)"
      x_order: ["Before", "After"]
      group_order: ["control", "ifs"]
      figure_size: [4.2, 3.35]
      box_width: 0.055
      group_gap: 0.38
      x_gap: 0.24
      x_margin: 0.12
      jitter_sd: 0.010
      sex_dodge: 0.010
      point_size: 8
      title: false
      ylim_top_mult: 1.10
      wide_to_long:
        x_col: "timepoint"
        mapping:
          Before: "hand__Before__time_in_right_lower_quadrant"
          After: "hand__After__time_in_right_lower_quadrant"

  auto_from_correlations:
    enabled: true
    fit_enabled: true
    exclude: []