# ---------------------------------------------------------------------------
# Analysis plan for this experiment. Merged over configs/stats.yaml, which holds
# method defaults only; lists here (endpoints, models, specs) replace the shared ones.
#
# primary_endpoints: per assay instance/type or linear-model name, the endpoints
#   that test the experiment's hypotheses. Everything else is reported as
#   exploratory. Primary and exploratory endpoints are corrected as separate
#   families (column endpoint_role in every output table).
#
# To show the plan was fixed before analysis: commit this file, then set
#   analysis_frozen_at: <commit sha>
# at the top level (outside `analysis`). Every run then checks that this block
# is unchanged since that commit; with --require-clean a change is an error.
# ---------------------------------------------------------------------------

analysis:
  assays:
    - vit
    - nor
    - oft1
    - oft2
    - oft3
    - oft4
    - lm
    - misc
  primary_endpoints: {}
  primary_one_sample:
    nulls:
      nor:
        di_explore: 0.0
        di_iz: 0.0
      misc:
        rct_di: 0.0
  diagnostics:
    endpoints:
      nor:
        - fam_total_explore_time
        - test_novel_explore_time
        - test_familiar_iz_time
        - test_novel_iz_time
        - di_explore
        - di_iz
        - fam_total_distance_moved
        - test_total_distance_moved
      oft:
        - total_distance_moved
        - time_in_center
        - distance_moved_in_center
        - time_in_corners
        - classifier__supported_rearing_time
        - classifier__supported_rearing_count
        - classifier__unsupported_rearing_time
        - classifier__unsupported_rearing_count
        - classifier__grooming_time
        - classifier__grooming_count
        - classifier__digging_time
        - classifier__digging_count
      vit:
        - delta_after_minus_before__hand__time_in_right_lower_quadrant
        - hand__Before__time_in_right_lower_quadrant
        - hand__After__time_in_right_lower_quadrant
        - standing__Before__distance_moved_in_left_lower_quadrant
        - standing__Before__distance_moved_in_left_upper_quadrant
        - standing__Before__distance_moved_in_right_lower_quadrant
        - standing__Before__distance_moved_in_right_upper_quadrant
      lm:
        - distance_moved_in_central_alley
        - total_distance_moved
        - distance_moved_in_narrow_alley
        - distance_moved_in_protected_alley
        - latency_to_enter_narrow_alley
        - latency_to_enter_protected_alley
        - latency_to_re_enter_narrow_alley
        - latency_to_re_enter_protected_alley
        - transitions_into_central_alley
        - transitions_into_narrow_alley
        - transitions_into_protected_alley
        - time_in_central_alley
        - time_in_narrow_alley
        - time_in_protected_alley
      misc:
        - left_adrenal_mg
        - right_adrenal_mg
        - adrenal_total_mg
        - left_adrenal_mg_per_g_bw
        - right_adrenal_mg_per_g_bw
        - adrenal_total_mg_per_g_bw
        - rct_total_intake
        - rct_pi
        - rct_di
        - marbles_buried
        - immobility_time_s
        - immobility_fraction
        - immobility_bouts
        - immobility_mean_bout_len_s
        - immobility_latency_s
        - swinging_time_s
        - swinging_fraction
        - swinging_bouts
        - swinging_mean_bout_len_s
        - swinging_latency_s
        - curling_time_s
        - curling_fraction
        - curling_bouts
        - curling_mean_bout_len_s
        - curling_latency_s
        - total_mobility_time_s
        - total_mobility_fraction
        - total_mobility_bouts
        - total_mobility_mean_bout_len_s
  secondary_two_way_anova:
    endpoints:
      nor:
        - fam_total_explore_time
        - test_novel_explore_time
        - test_familiar_iz_time
        - test_novel_iz_time
        - di_explore
        - di_iz
        - fam_total_distance_moved
        - test_total_distance_moved
      oft:
        - total_distance_moved
        - time_in_center
        - distance_moved_in_center
        - time_in_corners
        - classifier__supported_rearing_time
        - classifier__supported_rearing_count
        - classifier__unsupported_rearing_time
        - classifier__unsupported_rearing_count
        - classifier__grooming_time
        - classifier__grooming_count
        - classifier__digging_time
        - classifier__digging_count
      vit:
        - delta_after_minus_before__hand__time_in_right_lower_quadrant
        - hand__Before__time_in_right_lower_quadrant
        - hand__After__time_in_right_lower_quadrant
        - standing__Before__distance_moved_in_left_lower_quadrant
        - standing__Before__distance_moved_in_left_upper_quadrant
        - standing__Before__distance_moved_in_right_lower_quadrant
        - standing__Before__distance_moved_in_right_upper_quadrant
      lm:
        - distance_moved_in_central_alley
        - total_distance_moved
        - distance_moved_in_narrow_alley
        - distance_moved_in_protected_alley
        - transitions_into_central_alley
        - transitions_into_narrow_alley
        - transitions_into_protected_alley
        - time_in_central_alley
        - time_in_narrow_alley
        - time_in_protected_alley
      misc:
        - left_adrenal_mg
        - right_adrenal_mg
        - adrenal_total_mg
        - left_adrenal_mg_per_g_bw
        - right_adrenal_mg_per_g_bw
        - adrenal_total_mg_per_g_bw
        - rct_total_intake
        - rct_pi
        - rct_di
        - marbles_buried
        - immobility_time_s
        - immobility_fraction
        - immobility_bouts
        - immobility_mean_bout_len_s
        - immobility_latency_s
        - swinging_time_s
        - swinging_fraction
        - swinging_bouts
        - swinging_mean_bout_len_s
        - swinging_latency_s
        - curling_time_s
        - curling_fraction
        - curling_bouts
        - curling_mean_bout_len_s
        - curling_latency_s
        - total_mobility_time_s
        - total_mobility_fraction
        - total_mobility_bouts
        - total_mobility_mean_bout_len_s
  time_to_event:
    endpoints:
      lm:
        - latency_to_enter_protected_alley
        - latency_to_re_enter_protected_alley
        - latency_to_enter_narrow_alley
        - latency_to_re_enter_narrow_alley
  linear_models:
    models:
      - name: oft_post_sessions
        assays:
          - oft2
          - oft3
          - oft4
        stack_as: session
        baseline: oft1
        endpoints:
          - total_distance_moved
          - time_in_center
        fixed: group * sex * session + baseline
        random: ~ 1 | mouse_id
        variance_by:
          - group
        # log | log1p | sqrt | logit, applied to the endpoint and its baseline;
        # estimates/contrasts are on that scale (log: differences = log ratios)
        transforms:
          time_in_center: log
        contrasts:
          - factor: group
            by:
              - session
  correlations:
    specs:
      - assay: nor
        x: test_total_distance_moved
        y: test_novel_explore_time
      - assay: nor
        x: di_explore
        y: test_total_explore_time
      - assay: oft
        x: total_distance_moved
        y: time_in_center
      - assay: lm
        x: latency_to_enter_narrow_alley
        y: time_in_narrow_alley
        method: pearson
        groupings:
          - []
