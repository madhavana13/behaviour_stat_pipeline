  #        analysis that stacks sessions or uses a baseline; sessions follow this order,
  #        never their names. TODO: fill in for EXP-2026-002.
  # day:   optional, e.g. days relative to IFS onset (negative = before). Lets models use
  #        time as a number (fixed: "group * day").

  OFT1:
    assay_type: OFT
    order: null   # TODO
    day: null
    raw_path: data/experiments/EXP-2026-002/raw/OFT1
    classifier_pattern: "*_Report_summary.csv"
    session: pre
    pattern: "*_output_summary.csv"

  OFT2:
    assay_type: OFT
